# ============================================================
# Secure MCP Gateway — Project Configuration
# ============================================================

# Agent Mode:
#   "simple" : Simple ReAct logic (Scripted Thought/Action, NO external API key needed!)
#   "llm"    : External LLM API (Gemini)
agent_mode: "simple"

# 5G Core Backend:
#   LIVE mode: calls free5GC WebConsole REST API & runs UERANSIM nr-cli
live_5gc: true

free5gc:
  webconsole_url: "http://localhost:5000"
  plmn_id: "20893"
  username: "admin"
  password: "free5gc"

ueransim:
  nr_cli_path: "./UERANSIM/build/nr-cli"
  default_supi: "imsi-208930000000001"

# SMF service-based interface (Nsmf_PDUSession).
# Used for NETWORK-INITIATED PDU session release: the attack calls the core's
# own ReleaseSMContext API so the SMF/UPF tear the session down. The UE is not
# driven to release itself. Matches smfcfg.yaml sbi (scheme/registerIPv4/port).
smf:
  sbi_url: "http://127.0.0.2:8000"

# NRF access-token endpoint. free5GC SBI is OAuth2-protected (nrfcfg oauth: true),
# so the SMF release requires an NRF-signed token with scope 'nsmf-pdusession'.
# The agent presents a registered NF identity whose per-instance certificate the
# NRF trusts (cert_dir is scanned for cert/<nftype>_<uuid>.pem). Set `consumer`
# to pin a specific identity instead of auto-detecting.
nrf:
  sbi_url: "http://127.0.0.10:8000"
  cert_dir: "free5gc/cert"
  # consumer: { type: "NEF", instance_id: "f7ec9409-15a4-4440-9f5e-cb51d4053ecd" }

demo:
  log_level: "INFO"
  evidence_log: "attack_evidence.jsonl"
