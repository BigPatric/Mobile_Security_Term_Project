# Core endpoints (free5GC v4.1.0 + UERANSIM testbed)
free5gc:
  webconsole_url: "http://localhost:5000"
  plmn_id: "20893"
  username: "admin"
  password: "free5gc"
  http_timeout_sec: 60       # WebConsole read timeout; raise for 500+ UEs (bulk GET is large/slow)

smf:                       # Nsmf_PDUSession SBI, for the release call
  sbi_url: "http://127.0.0.2:8000"

nrf:                       # only used when the SBI is OAuth2-protected (nrfcfg oauth: true)
  sbi_url: "http://127.0.0.10:8000"
  cert_dir: "free5gc/cert"

# L1: privacy + synchronization (gateway/l1/, docs/L1_DESIGN.md)
l1:
  sync:
    interval_sec: 2          # bulk poll: 1 request per cycle at any number of UEs
    max_age_sec: 6           # older than this, views are flagged stale
    audit_per_cycle: 10      # SM contexts checked against the SMF per cycle
    shrink_guard: 0.5        # losing more than half the UEs at once needs a second snapshot
  tokens:
    epoch_sec: 3600          # rotate tokens hourly (0 = never)
    grace_sec: 120           # previous epoch's tokens still accepted as arguments
    ue_pools: ["10.60.0.0/15"]
  views: {page_size: 50, max_changes: 100, min_group: 5}
  policy:
    untrusted_sources: [get_alert_logs]
    untrusted_identifiers: mask          # mask | tokenize
    identifier_params: [supi_token, supi, imsi]
    tools:
      "*": {checks: [identifier]}
      trigger_pdu_session_release:
        checks: [identifier, {freshness: {max_age_sec: 1, require_etag: true}}]
